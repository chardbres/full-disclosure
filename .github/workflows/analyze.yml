name: Analyze new filings

on:
  schedule:
    # Every day at 12:00 UTC, early morning in the US
    - cron: "0 12 * * *"
  # Lets you start a run by hand from the Actions tab
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      # Analyzes every filing worth summarizing from the past week that isn't
      # in the database yet. A week covers several filings on one day and a
      # few missed runs.
      - run: python analysis.py --days 7 $(grep -v '^#' watchlist.txt)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
